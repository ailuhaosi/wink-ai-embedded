## wink-micro-os ESP-IDF 组件配置
## 用法：在 ESP-IDF 项目中通过 idf_component.yml 依赖此目录
##
## dependencies:
##   wink-micro-os:
##     path: ../path/to/wink-micro-os

version: "0.1.0"
description: "Wink Micro OS - 面向 AI 生成嵌入式应用的最小运行时"
url: "https://github.com/wink-ai/wink-micro-os"
maintainers:
  - "Wink AI Team"
license: "Apache-2.0"

targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - esp32c6

dependencies:
  idf: ">=5.0"
